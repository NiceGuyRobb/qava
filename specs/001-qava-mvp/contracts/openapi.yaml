openapi: 3.1.0
info:
  title: Qava MVP API
  version: 1.0.0
  description: Contract-first authoring, interviewing, projection, health, and explicit publication.
servers:
  - url: /api/v1
security:
  - hostIdentity: []
paths:
  /questionnaire-drafts:
    post:
      operationId: createQuestionnaireDraft
      summary: Create a draft from an output contract
      x-qava-permission: author
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDraftRequest'
      responses:
        '201':
          description: Draft compiled with deterministic proposals and decisions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionnaireDraft'
        '422':
          $ref: '#/components/responses/ValidationProblem'
  /questionnaire-drafts/{draftId}:
    parameters:
      - $ref: '#/components/parameters/DraftId'
    get:
      operationId: getQuestionnaireDraft
      summary: Read current draft and validation state
      x-qava-permission: author
      responses:
        '200':
          description: Current draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionnaireDraft'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
    patch:
      operationId: updateQuestionnaireDraft
      summary: Apply explicit author decisions or supported draft edits
      x-qava-permission: author
      parameters:
        - $ref: '#/components/parameters/ExpectedRevisionHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDraftRequest'
      responses:
        '200':
          description: Recompiled draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionnaireDraft'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
  /questionnaire-drafts/{draftId}/validate:
    parameters:
      - $ref: '#/components/parameters/DraftId'
    post:
      operationId: validateQuestionnaireDraft
      summary: Run the complete publication gate without side effects
      x-qava-permission: author
      responses:
        '200':
          description: Validation report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationReport'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
  /questionnaire-drafts/{draftId}/publish:
    parameters:
      - $ref: '#/components/parameters/DraftId'
    post:
      operationId: publishQuestionnaireDraft
      summary: Explicitly publish one immutable questionnaire version
      x-qava-permission: author
      parameters:
        - $ref: '#/components/parameters/ExpectedRevisionHeader'
      responses:
        '201':
          description: Published immutable questionnaire
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedQuestionnaireSummary'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
  /questionnaires/{questionnaireId}/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/QuestionnaireId'
      - $ref: '#/components/parameters/Version'
    get:
      operationId: getPublishedQuestionnaire
      summary: Read an immutable published questionnaire
      responses:
        '200':
          description: Published questionnaire runtime package
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedQuestionnaire'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
  /sessions:
    post:
      operationId: createSession
      summary: Start an interview against an exact questionnaire version
      x-qava-permission: respondent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Initial complete session view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
  /sessions/{sessionId}:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    get:
      operationId: getSession
      summary: Read or resume the latest complete session view
      x-qava-permission: respondent
      responses:
        '200':
          description: Latest complete session view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '404':
          $ref: '#/components/responses/NotFoundProblem'
    delete:
      operationId: deleteSession
      summary: Delete Qava session-scoped records without retracting external artifacts
      x-qava-permission: respondent
      parameters:
        - $ref: '#/components/parameters/ExpectedRevisionHeader'
        - name: confirm_external_artifacts_remain
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '204':
          description: Session-scoped records deleted
        '428':
          $ref: '#/components/responses/PreconditionProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
  /sessions/{sessionId}/answers:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: submitAnswer
      summary: Accept or replace one typed answer and return the complete updated view
      x-qava-permission: respondent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAnswerRequest'
      responses:
        '200':
          description: Complete updated session view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
  /sessions/{sessionId}/skips:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: skipInteraction
      summary: Record a permitted skip and return the complete updated view
      x-qava-permission: respondent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionMutationRequest'
      responses:
        '200':
          description: Complete updated session view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
  /sessions/{sessionId}/navigation:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: navigateSession
      summary: Navigate to a declared section or unresolved output need
      x-qava-permission: respondent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NavigationRequest'
      responses:
        '200':
          description: Complete updated session view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionView'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
  /sessions/{sessionId}/publication-preview:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: previewPublication
      summary: Validate and preview a destination without side effects
      x-qava-permission: publisher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicationPreviewRequest'
      responses:
        '200':
          description: Side-effect-free destination preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationPreview'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
  /sessions/{sessionId}/publications:
    parameters:
      - $ref: '#/components/parameters/SessionId'
    post:
      operationId: publishSessionResult
      summary: Explicitly publish one exact ready revision
      x-qava-permission: publisher
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      responses:
        '200':
          description: Existing receipt returned for an idempotent repeat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationReceipt'
        '201':
          description: New publication attempt completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicationReceipt'
        '403':
          $ref: '#/components/responses/ForbiddenProblem'
        '409':
          $ref: '#/components/responses/ConflictProblem'
        '422':
          $ref: '#/components/responses/ValidationProblem'
components:
  securitySchemes:
    hostIdentity:
      type: apiKey
      in: header
      name: X-Qava-Identity
      description: Trusted-host normalized identity context; direct public clients must not set this header.
  parameters:
    DraftId:
      name: draftId
      in: path
      required: true
      schema:
        type: string
    QuestionnaireId:
      name: questionnaireId
      in: path
      required: true
      schema:
        type: string
    Version:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
    ExpectedRevisionHeader:
      name: If-Match
      in: header
      required: true
      description: Quoted current integer revision, for example `"7"`.
      schema:
        type: string
        pattern: '^"[1-9][0-9]*"$'
  responses:
    NotFoundProblem:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ForbiddenProblem:
      description: Identity lacks the required Qava permission
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ConflictProblem:
      description: Stale revision or idempotency conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    PreconditionProblem:
      description: Confirmation is required because successful external artifacts will remain
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ValidationProblem:
      description: Contract, answer, mapping, readiness, or publication validation failed
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    JsonSchema:
      type: object
      additionalProperties: true
    CreateDraftRequest:
      type: object
      additionalProperties: false
      required: [id, title, output_contract]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]*$'
        title:
          type: string
          minLength: 1
        description:
          type: string
        output_contract:
          $ref: '#/components/schemas/JsonSchema'
    UpdateDraftRequest:
      type: object
      additionalProperties: false
      required: [operations]
      properties:
        operations:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/DraftOperation'
    DraftOperation:
      oneOf:
        - type: object
          additionalProperties: false
          required: [operation, decision_id, resolution]
          properties:
            operation:
              const: resolve_decision
            decision_id:
              type: string
            resolution:
              enum: [accept, reject, override]
            value: {}
        - type: object
          additionalProperties: false
          required: [operation, question]
          properties:
            operation:
              const: upsert_question
            question:
              $ref: '#/components/schemas/Question'
        - type: object
          additionalProperties: false
          required: [operation, question_id]
          properties:
            operation:
              const: remove_question
            question_id:
              type: string
    QuestionnaireDraft:
      type: object
      additionalProperties: false
      required: [id, revision, title, output_contract, output_needs, questions, decisions, validation]
      properties:
        id:
          type: string
        revision:
          type: integer
          minimum: 1
        title:
          type: string
        output_contract:
          $ref: '#/components/schemas/JsonSchema'
        output_needs:
          type: array
          items:
            $ref: '#/components/schemas/OutputNeed'
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/AuthoringDecision'
        validation:
          $ref: '#/components/schemas/ValidationReport'
    ValidationReport:
      type: object
      additionalProperties: false
      required: [is_publishable, issues]
      properties:
        is_publishable:
          type: boolean
        issues:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
    OutputNeed:
      type: object
      additionalProperties: false
      required: [id, target, value_schema, required, criticality, weight]
      properties:
        id:
          type: string
        target:
          type: string
          pattern: '^/(?:[^~/]|~0|~1)*(?:/(?:[^~/]|~0|~1)*)*$'
        value_schema:
          $ref: '#/components/schemas/JsonSchema'
        required:
          type: boolean
        criticality:
          enum: [normal, blocking]
        weight:
          type: number
          exclusiveMinimum: 0
    Question:
      type: object
      additionalProperties: false
      required: [id, output_need_ids, prompt, answer_schema, mapping, presentation, required, order]
      properties:
        id:
          type: string
        output_need_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        prompt:
          type: string
          minLength: 1
        help_text:
          type: [string, 'null']
        answer_schema:
          $ref: '#/components/schemas/JsonSchema'
        choices:
          type: [array, 'null']
          items:
            $ref: '#/components/schemas/Choice'
        mapping:
          $ref: '#/components/schemas/Mapping'
        applicability:
          oneOf:
            - $ref: '#/components/schemas/Condition'
            - type: 'null'
        presentation:
          $ref: '#/components/schemas/ComponentSpec'
        required:
          type: boolean
        order:
          type: integer
          minimum: 0
    Choice:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id: {}
        label:
          type: string
          minLength: 1
    Mapping:
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode, target]
          properties:
            mode:
              const: direct
            target:
              type: string
        - type: object
          additionalProperties: false
          required: [mode, target, sources, shape]
          properties:
            mode:
              const: compose
            target:
              type: string
            sources:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                type: string
            shape:
              enum: [object, array]
    Condition:
      type: object
      additionalProperties: false
      required: [source_question_id, operator]
      properties:
        source_question_id:
          type: string
        operator:
          enum: [equals, contains, exists]
        value: {}
    ComponentSpec:
      type: object
      additionalProperties: false
      required: [name, version, props]
      properties:
        name:
          type: string
        version:
          type: integer
          minimum: 1
        props:
          type: object
        fallback:
          type: [string, 'null']
    AuthoringDecision:
      type: object
      additionalProperties: false
      required: [id, kind, proposal, status]
      properties:
        id:
          type: string
        kind:
          enum: [question, mapping, component, policy]
        proposal:
          type: object
        confidence:
          type: [number, 'null']
          minimum: 0
          maximum: 1
        reasons:
          type: array
          items:
            type: string
        status:
          enum: [pending, accepted, overridden, rejected]
    PublishedQuestionnaireSummary:
      type: object
      additionalProperties: false
      required: [id, version, content_hash, published_at]
      properties:
        id:
          type: string
        version:
          type: integer
        content_hash:
          type: string
        published_at:
          type: string
          format: date-time
    PublishedQuestionnaire:
      allOf:
        - $ref: '#/components/schemas/QuestionnaireDraft'
        - type: object
          required: [version, content_hash, component_catalog_version, health_policy, assistance_policy, allowed_result_adapters]
          properties:
            version:
              type: integer
              minimum: 1
            content_hash:
              type: string
            component_catalog_version:
              type: integer
              minimum: 1
            health_policy:
              $ref: '#/components/schemas/HealthPolicy'
            assistance_policy:
              $ref: '#/components/schemas/AssistancePolicy'
            allowed_result_adapters:
              type: array
              prefixItems:
                - const: json-document
              minItems: 1
              maxItems: 1
    CreateSessionRequest:
      type: object
      additionalProperties: false
      required: [questionnaire_id, questionnaire_version]
      properties:
        questionnaire_id:
          type: string
        questionnaire_version:
          type: integer
          minimum: 1
    SubmitAnswerRequest:
      type: object
      additionalProperties: false
      required: [interaction_id, expected_revision, value]
      properties:
        interaction_id:
          type: string
        expected_revision:
          type: integer
          minimum: 1
        value: {}
    SessionMutationRequest:
      type: object
      additionalProperties: false
      required: [interaction_id, expected_revision]
      properties:
        interaction_id:
          type: string
        expected_revision:
          type: integer
          minimum: 1
    NavigationRequest:
      type: object
      additionalProperties: false
      required: [expected_revision]
      properties:
        expected_revision:
          type: integer
          minimum: 1
        section_id:
          type: string
        output_need_id:
          type: string
      oneOf:
        - required: [section_id]
        - required: [output_need_id]
    SessionView:
      type: object
      additionalProperties: false
      required: [session, progress, current_interaction, result, health, actions, changed_paths]
      properties:
        session:
          $ref: '#/components/schemas/SessionSummary'
        progress:
          $ref: '#/components/schemas/Progress'
        current_interaction:
          oneOf:
            - $ref: '#/components/schemas/RuntimeInteraction'
            - type: 'null'
        result:
          $ref: '#/components/schemas/ResultProjection'
        health:
          $ref: '#/components/schemas/HealthAssessment'
        actions:
          type: array
          uniqueItems: true
          items:
            enum: [answer, skip, navigate, save_and_exit, preview_publication, publish, delete]
        changed_paths:
          type: array
          items:
            type: string
    SessionSummary:
      type: object
      additionalProperties: false
      required: [id, questionnaire_id, questionnaire_version, revision, status]
      properties:
        id:
          type: string
        questionnaire_id:
          type: string
        questionnaire_version:
          type: integer
        revision:
          type: integer
        status:
          enum: [active, completed]
    Progress:
      type: object
      additionalProperties: false
      required: [satisfied_required, total_required]
      properties:
        satisfied_required:
          type: integer
          minimum: 0
        total_required:
          type: integer
          minimum: 0
    RuntimeInteraction:
      type: object
      additionalProperties: false
      required: [id, kind, output_need_ids, prompt, reason, required, answer_schema, component]
      properties:
        id:
          type: string
        kind:
          enum: [question, clarification, confirmation, review]
        output_need_ids:
          type: array
          minItems: 1
          items:
            type: string
        prompt:
          type: string
        reason:
          type: string
        required:
          type: boolean
        answer_schema:
          $ref: '#/components/schemas/JsonSchema'
        component:
          $ref: '#/components/schemas/ComponentSpec'
        policy_limit:
          oneOf:
            - $ref: '#/components/schemas/RuntimePolicyLimit'
            - type: 'null'
    ResultProjection:
      type: object
      additionalProperties: false
      required: [session_id, revision, status, data, provenance, unresolved_output_needs, issues]
      properties:
        session_id:
          type: string
        revision:
          type: integer
        status:
          enum: [in_progress, ready, published]
        data:
          type: object
        provenance:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        unresolved_output_needs:
          type: array
          items:
            $ref: '#/components/schemas/OutputNeedSummary'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
    HealthAssessment:
      type: object
      additionalProperties: false
      required: [revision, score, readiness, dimensions, attention, calculation_version]
      properties:
        revision:
          type: integer
        score:
          type: integer
          minimum: 0
          maximum: 100
        readiness:
          enum: [not_ready, needs_attention, ready]
        dimensions:
          type: object
          additionalProperties: false
          required: [completeness, validity, confidence, consistency, specificity]
          properties:
            completeness:
              type: integer
              minimum: 0
              maximum: 100
            validity:
              type: integer
              minimum: 0
              maximum: 100
            confidence:
              type: integer
              minimum: 0
              maximum: 100
            consistency:
              type: integer
              minimum: 0
              maximum: 100
            specificity:
              type: integer
              minimum: 0
              maximum: 100
        attention:
          type: array
          items:
            $ref: '#/components/schemas/AttentionItem'
        calculation_version:
          type: integer
          minimum: 1
    HealthPolicy:
      type: object
      additionalProperties: false
      required: [calculation_version, weights, publication_gate]
      properties:
        calculation_version:
          type: integer
          minimum: 1
        weights:
          type: object
          additionalProperties: false
          required: [completeness, validity, confidence, consistency, specificity]
          properties:
            completeness: { type: number, exclusiveMinimum: 0 }
            validity: { type: number, exclusiveMinimum: 0 }
            confidence: { type: number, exclusiveMinimum: 0 }
            consistency: { type: number, exclusiveMinimum: 0 }
            specificity: { type: number, exclusiveMinimum: 0 }
        publication_gate:
          type: object
          additionalProperties: false
          required: [require_all_required, minimum_validity, block_on]
          properties:
            require_all_required:
              const: true
            minimum_validity:
              type: integer
              minimum: 0
              maximum: 100
            block_on:
              enum: [blocking, warning]
    AssistancePolicy:
      type: object
      additionalProperties: false
      required: [enabled_operations, maximum_clarifications_per_interaction, maximum_generated_interactions_per_session, timeout_ms, require_extraction_confirmation]
      properties:
        enabled_operations:
          type: array
          uniqueItems: true
          items:
            enum: [authoring, ranking, clarification, extraction]
        maximum_clarifications_per_interaction:
          type: integer
          minimum: 0
          maximum: 2
        maximum_generated_interactions_per_session:
          type: integer
          minimum: 0
          maximum: 1000
        timeout_ms:
          type: integer
          minimum: 1
        require_extraction_confirmation:
          const: true
    RuntimePolicyLimit:
      type: object
      additionalProperties: false
      required: [originating_interaction_id, generation_index, maximum_followups, maximum_session_interactions]
      properties:
        originating_interaction_id:
          type: string
        generation_index:
          type: integer
          minimum: 1
        maximum_followups:
          type: integer
          minimum: 0
          maximum: 2
        maximum_session_interactions:
          type: integer
          minimum: 1
          maximum: 1000
    OutputNeedSummary:
      type: object
      additionalProperties: false
      required: [id, target, required, criticality, question_id]
      properties:
        id:
          type: string
        target:
          type: string
        label:
          type: [string, 'null']
        required:
          type: boolean
        criticality:
          enum: [normal, blocking]
        question_id:
          type: string
        topic_id:
          type: [string, 'null']
    AttentionItem:
      type: object
      additionalProperties: false
      required: [code, severity, message, recommended_action, evidence]
      properties:
        code:
          type: string
        severity:
          enum: [info, warning, blocking]
        output_need_id:
          type: [string, 'null']
        message:
          type: string
        recommended_action:
          type: string
        evidence:
          type: array
          items:
            type: object
    Issue:
      type: object
      additionalProperties: false
      required: [code, severity, message]
      properties:
        code:
          type: string
        severity:
          enum: [info, warning, blocking]
        path:
          type: [string, 'null']
        message:
          type: string
    PublicationPreviewRequest:
      type: object
      additionalProperties: false
      required: [session_revision, adapter]
      properties:
        session_revision:
          type: integer
          minimum: 1
        adapter:
          const: json-document
    PublicationPreview:
      type: object
      additionalProperties: false
      required: [session_revision, adapter, is_valid, issues, preview]
      properties:
        session_revision:
          type: integer
        adapter:
          type: string
        is_valid:
          type: boolean
        issues:
          type: array
          items:
            $ref: '#/components/schemas/Issue'
        preview:
          type: object
    PublishRequest:
      type: object
      additionalProperties: false
      required: [session_revision, adapter]
      properties:
        session_revision:
          type: integer
          minimum: 1
        adapter:
          const: json-document
    PublicationReceipt:
      type: object
      additionalProperties: false
      required: [id, session_id, session_revision, adapter, idempotency_key, status, destination, created_at]
      properties:
        id:
          type: string
        session_id:
          type: string
        session_revision:
          type: integer
        adapter:
          type: string
        idempotency_key:
          type: string
        status:
          enum: [succeeded, failed, outcome_unknown, denied]
        destination:
          type: string
        external_reference:
          type: [string, 'null']
        error:
          oneOf:
            - $ref: '#/components/schemas/ProblemDetail'
            - type: 'null'
        created_at:
          type: string
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
    ProblemDetail:
      type: object
      additionalProperties: true
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
